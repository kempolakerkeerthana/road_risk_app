<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Road Risk Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<style>body{font-family:Arial;max-width:900px;margin:20px auto;padding:0 10px}
input,select,button{margin:3px;padding:6px}.box{border:1px solid #ccc;border-radius:8px;padding:12px;margin:12px 0}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:5px;text-align:left}</style></head>
<body>
<h2>Road Accident Risk Dashboard</h2>

    <div id="auth" class="box">
      <input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password">
  <button onclick="auth('login')">Login</button><button onclick="auth('register')">Register</button>
  <span id="msg"></span>
</div>

<div id="app" style="display:none">
  <div class="box"><h3>Predict severity</h3>
    Hour <input id="hour" type="number" min="0" max="23" value="23" style="width:60px">
    Day <select id="day"><option value="0">Mon</option><option value="1">Tue</option><option value="2">Wed</option>
      <option value="3">Thu</option><option value="4">Fri</option><option value="5" selected>Sat</option><option value="6">Sun</option></select>
    Temp(F) <input id="temp" type="number" value="60" style="width:70px">
    Humidity <input id="hum" type="number" value="70" style="width:70px">
    Visibility(mi) <input id="vis" type="number" value="10" style="width:70px"><br>
    Weather <select id="weather"><option>Fair</option><option>Cloudy</option><option>Fog</option><option>Light Rain</option>
      <option>Rain</option><option>Light Snow</option><option>Overcast</option><option>Partly Cloudy</option>
      <option>Mostly Cloudy</option><option>Thunder in the Vicinity</option><option>Other</option></select>
    <label><input type="checkbox" id="night" checked>Night</label>
    <label><input type="checkbox" id="junc">Junction</label>
    <label><input type="checkbox" id="sig">Traffic signal</label>
    <label><input type="checkbox" id="cross">Crossing</label>
    <button onclick="predict()">Predict</button>
    <div id="result" style="margin-top:8px"></div>
  </div>

  <div class="box"><h3>Dashboard</h3><div style="max-width:500px"><canvas id="chart"></canvas></div></div>

  <div class="box"><h3>History</h3>
    <table><thead><tr><th>Time</th><th>Severity</th><th>Confidence</th><th>Note</th><th></th></tr></thead>
    <tbody id="rows"></tbody></table></div>
</div>

<script>
const $ = id => document.getElementById(id);
let T = "", chart;
const api = async (path, method = "GET", body) => {
  const r = await fetch(path, {method, headers: {"Content-Type": "application/json", token: T}, body: body && JSON.stringify(body)});
  const j = await r.json(); if (!r.ok) throw j.detail; return j;
};
async function auth(a) {
  try {
    const j = await api("/" + a, "POST", {username: $("u").value, password: $("p").value});
    if (a == "login") { T = j.token; $("auth").style.display = "none"; $("app").style.display = "block"; load(); }
    else $("msg").textContent = "Registered. Now login.";
  } catch (e) { $("msg").textContent = e; }
}
async function predict() {
  try {
    const r = await api("/predict", "POST", {hour: +$("hour").value, day_of_week: +$("day").value,
      temperature: +$("temp").value, humidity: +$("hum").value, visibility: +$("vis").value,
      weather: $("weather").value, is_night: +$("night").checked, junction: +$("junc").checked,
      traffic_signal: +$("sig").checked, crossing: +$("cross").checked});
    $("result").innerHTML = `<b>Predicted severity: ${r.severity}</b> (confidence ${r.confidence})` +
      (r.low_confidence ? " &#9888; Low confidence, do not rely on this alone" : "") + "<br>" +
      Object.entries(r.probabilities).map(([k, v]) => `Severity ${k}: ${v}`).join(" | ");
    load();
  } catch (e) { $("result").textContent = e; }
}
async function load() {
  const h = await api("/history"), s = await api("/stats");
  $("rows").innerHTML = h.map(x => `<tr><td>${x.created}</td><td>${x.severity}</td><td>${x.confidence}</td><td>${x.note}</td>
    <td><button onclick="note(${x.id})">Note</button><button onclick="del(${x.id})">Delete</button></td></tr>`).join("");
  chart && chart.destroy();
  chart = new Chart($("chart"), {type: "bar", data: {labels: ["Sev 1", "Sev 2", "Sev 3", "Sev 4"],
    datasets: [{label: "My assessments", data: [1, 2, 3, 4].map(k => s.by_severity[k] || 0)}]}});
}
async function note(id) { const n = prompt("Note:"); if (n !== null) { await api("/history/" + id, "PUT", {note: n}); load(); } }
async function del(id) { await api("/history/" + id, "DELETE"); load(); }
</script></body></html>
